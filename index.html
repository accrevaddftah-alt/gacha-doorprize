<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaca Doorprize HUT RI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <button id="themeToggle" class="theme-toggle" aria-label="Ganti Tema">☀️</button>

    <div class="app-container">
        <header>
            <div class="badge-pill">
                🎟️ Pengundian Kupon
            </div>
            <h1>Gacha Doorprize RT 41</h1>
            <p>Acak Nomor Doorprize Peserta Terdaftar</p>
        </header>

        <div class="input-group">
            <div class="input-box">
                <label>Nomor Awal:</label>
                <!-- Menghapus readonly agar bisa diedit -->
                <input type="number" id="startNum" placeholder="0" min="1">
            </div>
            <div class="input-box">
                <label>Nomor Akhir (Total):</label>
                <input type="number" id="endNum" placeholder="0" min="1">
            </div>
        </div>

        <button id="drawButton">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Acak Sekarang!
        </button>

        <div class="result-box" id="resultBox">
            <div class="trophy-icon">🏆</div>
            <p class="result-label">Nomor Doorprize Terpilih:</p>
            <h2 id="resultNumber">#---</h2>
        </div>

        <div class="footer-history">
            <div class="history-header">
                <span>Sisa Kupon: <b id="remainingCount">0</b> | Riwayat:</span>
                <button id="resetButton" class="reset-btn">Reset Data</button>
            </div>
            <div id="drawnList"></div>
        </div>
    </div>
    <!-- CUSTOM MODAL -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <div class="modal-title" id="modalTitle">Judul</div>
            <div class="modal-message" id="modalMessage">Pesan</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="modalCancelBtn">Batal</button>
                <button class="modal-btn btn-confirm" id="modalConfirmBtn">Ya</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- SCRIPT TAMBAHAN AGAR BISA OFFLINE -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Mode Offline Aktif!', reg);
                }).catch(err => {
                    console.log('Service Worker gagal', err);
                });
            });
        }
    </script>
</body>
</html>
